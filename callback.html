<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #191414;
            color: white;
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #1DB954;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div>
        <div class="spinner" id="spinner"></div>
        <h2 id="status">🎵 Connecting...</h2>
        <p id="msg">Please wait</p>
    </div>

    <script>
        const CLIENT_ID = '12a6123eb15d451c976d168ce0fce55d';
        const REDIRECT_URI = 'https://music-player-mohitsoni5842s-projects.vercel.app/callback.html';
        
        console.log('=== CALLBACK DEBUG ===');
        console.log('Redirect URI:', REDIRECT_URI);
        
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const err = params.get('error');

        if (err) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status').textContent = '❌ Error';
            document.getElementById('msg').textContent = err;
        } else if (code) {
            const verifier = localStorage.getItem('code_verifier');
            
            console.log('Code verifier:', verifier ? 'Found ✅' : 'Missing ❌');
            
            if (!verifier) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('status').textContent = '❌ Missing Verifier';
                document.getElementById('msg').innerHTML = 'Code verifier not found. <a href="index.html" style="color: #1DB954;">Try again</a>';
            } else {
                fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        client_id: CLIENT_ID,
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: REDIRECT_URI,
                        code_verifier: verifier,
                    })
                })
                .then(r => {
                    console.log('Response status:', r.status);
                    return r.json();
                })
                .then(data => {
                    console.log('Response:', data);
                    
                    if (data.access_token) {
                        localStorage.setItem('spotify_token', data.access_token);
                        localStorage.setItem('spotify_token_expiry', Date.now() + (data.expires_in * 1000));
                        localStorage.removeItem('code_verifier');
                        
                        document.getElementById('status').textContent = '✅ Success!';
                        document.getElementById('msg').textContent = 'Redirecting...';
                        
                        setTimeout(() => window.location.href = 'index.html', 1000);
                    } else {
                        document.getElementById('spinner').style.display = 'none';
                        document.getElementById('status').textContent = '❌ Failed';
                        document.getElementById('msg').textContent = data.error_description || data.error || 'Token error';
                    }
                })
                .catch(e => {
                    console.error('Error:', e);
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('status').textContent = '❌ Network Error';
                    document.getElementById('msg').textContent = e.message;
                });
            }
        } else {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status').textContent = '⚠️ No Code';
            document.getElementById('msg').textContent = 'No authorization code received';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #191414;
            color: white;
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #1DB954;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div>
        <div class="spinner"></div>
        <h2 id="status">🎵 Connecting...</h2>
        <p id="message">Please wait...</p>
    </div>

    <script>
        const CLIENT_ID = '12a6123eb15d451c976d168ce0fce55d';
        
        const isProduction = window.location.hostname !== '127.0.0.1' && window.location.hostname !== 'localhost';
        
        const REDIRECT_URI = isProduction 
            ? 'https://music-player-mohitsoni5842s-projects.vercel.app/callback.html'
            : 'http://127.0.0.1:3000/callback.html';

        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');

        if (error) {
            document.getElementById('status').innerHTML = '❌ Error';
            document.getElementById('message').innerHTML = `Error: ${error}`;
        } else if (code) {
            const codeVerifier = localStorage.getItem('code_verifier');

            fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    client_id: CLIENT_ID,
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: REDIRECT_URI,
                    code_verifier: codeVerifier,
                }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.access_token) {
                    localStorage.setItem('spotify_token', data.access_token);
                    localStorage.setItem('spotify_token_expiry', Date.now() + (data.expires_in * 1000));
                    localStorage.removeItem('code_verifier');
                    
                    document.getElementById('status').innerHTML = '✅ Success!';
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    throw new Error('No token');
                }
            })
            .catch(err => {
                document.getElementById('status').innerHTML = '❌ Failed';
                document.getElementById('message').innerHTML = err.message;
            });
        } else {
            document.getElementById('status').innerHTML = '⚠️ No Code';
        }
    </script>
</body>
</html>

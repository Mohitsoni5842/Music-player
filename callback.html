<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #191414;
            color: white;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 40px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #1DB954;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        button {
            background: #1DB954;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 20px;
        }
        button:hover {
            background: #1ed760;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2 id="status">🎵 Connecting to Spotify...</h2>
        <p id="message">Please wait while we authorize your account</p>
    </div>

    <script>
        console.log('=== CALLBACK PAGE ===');
        console.log('Full URL:', window.location.href);
        console.log('Hash:', window.location.hash);

        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const token = params.get('access_token');
        const expiresIn = params.get('expires_in');
        const error = params.get('error');

        console.log('Access Token:', token ? '✅ Received' : '❌ Not found');
        console.log('Expires In:', expiresIn);
        console.log('Error:', error);

        if (error) {
            console.error('Authorization error:', error);
            document.getElementById('status').innerHTML = '❌ Authorization Failed';
            document.getElementById('message').innerHTML = `
                <p>Error: ${error}</p>
                <button onclick="window.location.href='index.html'">Try Again</button>
            `;
        } else if (token) {
            console.log('✅ Token received, saving to localStorage...');
            
            // Save token
            localStorage.setItem('spotify_token', token);
            localStorage.setItem('spotify_token_expiry', Date.now() + (parseInt(expiresIn) * 1000));
            
            console.log('Token saved:', localStorage.getItem('spotify_token'));
            console.log('Expiry saved:', localStorage.getItem('spotify_token_expiry'));
            
            document.getElementById('status').innerHTML = '✅ Success!';
            document.getElementById('message').innerHTML = 'Redirecting to music player...';
            
            // Redirect after 1 second
            setTimeout(() => {
                console.log('Redirecting to index.html...');
                window.location.href = 'index.html';
            }, 1000);
        } else {
            console.error('No token or error in URL');
            document.getElementById('status').innerHTML = '⚠️ Something Went Wrong';
            document.getElementById('message').innerHTML = `
                <p>No authorization token received</p>
                <button onclick="window.location.href='index.html'">Back to App</button>
            `;
        }
    </script>
</body>
</html>
